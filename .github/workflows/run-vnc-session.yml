name: Run Linux VNC with Chrome via Docker Image

on:
  workflow_dispatch:

jobs:
  linux_vnc:
    runs-on: ubuntu-latest

    steps:
      - name: Set lowercase repo owner
        run: echo "REPO_OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV

      - name: Run job in container with custom image
        uses: addnab/docker-run-action@v3
        with:
          image: ghcr.io/${{ env.REPO_OWNER_LC }}/linux-vnc-chrome:latest
          options: -e VNC_PASSWORD=${{ secrets.VNC_PASSWORD }} -e NGROK_AUTH_TOKEN=${{ secrets.NGROK_AUTH_TOKEN }}
          run: |
            Xvfb :1 -screen 0 1024x768x16 &
            export DISPLAY=:1
            echo "export DISPLAY=:1" >> $GITHUB_ENV
            sleep 2
            startxfce4 &
            sleep 5
            x11vnc -storepasswd $VNC_PASSWORD /tmp/passwd
            x11vnc -forever -rfbauth /tmp/passwd -display :1 -shared -bg
            sleep 1

            ngrok config add-authtoken $NGROK_AUTH_TOKEN
            ngrok tcp 5900 --log=stdout > ngrok.log &
            sleep 3

            echo "⏳ Waiting for ngrok tunnel..."
            for i in {1..15}; do
              NGROK_URL=$(curl -s http://127.0.0.1:4040/api/tunnels | jq -r '.tunnels[0].public_url // empty')
              if [[ -n "$NGROK_URL" ]]; then
                echo "🔗 VNC Public URL: $NGROK_URL"
                break
              else
                echo "⌛ Still waiting..."
                sleep 2
              fi
            done

            if [[ -z "$NGROK_URL" ]]; then
              echo "❌ ngrok tunnel failed. ngrok logs:"
              cat ngrok.log
            fi

            echo $DISPLAY

            echo "🕒 Session ready. Connect your VNC client to the ngrok URL above."
            echo "Job will stay alive for 5.5 hours (19800 seconds)..."
            sleep 19800
